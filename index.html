<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalePuzzle - True Stained Glass Edition</title>
    <style>
        :root {
            --primary: #111417;
            --accent: #d35400;
            --bg-color: #f7f1e3;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 420px;
            padding: 12px 0;
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-radius: 14px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding-bottom: 30px;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card label {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .card input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .card input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: linear-gradient(135deg, #d35400, #e67e22);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid #dfe4ea;
            background: #f1f2f6;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: bold;
            color: #747d8c;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: var(--accent);
            background: #fff5f2;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(211, 84, 0, 0.15);
        }

        .preview-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-canvas-box {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #f1f2f6;
            flex-shrink: 0;
            background: #eee;
        }

        .preview-canvas-box canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-info strong {
            font-size: 0.9rem;
            color: var(--accent);
        }

        .preview-info span {
            font-size: 0.72rem;
            color: #747d8c;
            line-height: 1.4;
        }

        .message {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
            height: 1.2em;
        }

        .puzzle-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            gap: 5px;
            background: #0b0e11; 
            padding: 5px;
            border-radius: 16px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            border: 4px solid #1e272e;
        }

        .puzzle-board.completed {
            border: 4px solid #f1c40f;
            box-shadow: 0 0 35px rgba(241, 196, 15, 0.85);
            gap: 0;
            padding: 0;
            background: transparent;
        }

        .tile {
            background: #1e272e;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 3px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.1s;
        }

        .puzzle-board.completed .tile {
            border-radius: 0;
            box-shadow: none;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.9), inset 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .story-box {
            text-align: center;
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-box h2 {
            font-size: 0.95rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .story-box p {
            font-size: 0.82rem;
            line-height: 1.8;
            color: #2d3436;
            margin-bottom: 14px;
            text-align: left;
            background: #fff5f2;
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            white-space: pre-line;
        }

        .export-btn {
            background: linear-gradient(135deg, #00b894, #55efc4);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 TalePuzzle (True Stained Glass)</h1>
    </header>

    <div class="container">
        <div class="card">
            <label for="themeInput">✨ 幾何学ステンドグラス・パズル生成</label>
            <div class="input-group">
                <input type="text" id="themeInput" value="ウサギとカメ" placeholder="例: ウサギとカメ、窓の外を見つめる犬...">
                <button class="btn" id="generateBtn">生成</button>
            </div>
            
            <label style="margin-top: 4px;">🧩 パズル難易度</label>
            <div class="difficulty-selector">
                <button class="diff-btn active" data-size="2">初級 (2×2)</button>
                <button class="diff-btn" data-size="3">中級 (3×3)</button>
                <button class="diff-btn" data-size="4">上級 (4×4)</button>
            </div>
        </div>

        <div class="card preview-section">
            <div class="preview-canvas-box">
                <canvas id="previewCanvas" width="160" height="160"></canvas>
            </div>
            <div class="preview-info">
                <strong id="previewTitle">テーマ: ウサギとカメ</strong>
                <span>解くと光が透過し、至高のステンドグラスアートに！</span>
            </div>
        </div>

        <div class="message" id="message">ピースをタップして選択し、入れ替えてね！</div>

        <div class="puzzle-board" id="board"></div>

        <div class="card story-box" id="storyBox">
            <h2>✨ 本格ステンドグラスアート＆長編ストーリー解放！</h2>
            <p id="storyText">ここに物語が表示されます。</p>
            <button class="btn export-btn" id="saveBtn">🖼️ このステンドグラスアートを保存・シェアする</button>
        </div>
    </div>

    <script>
        let gridSize = 2;
        let boardState = [];
        let selectedIndex = null;
        let currentTheme = "ウサギとカメ";

        const themeInput = document.getElementById('themeInput');
        const generateBtn = document.getElementById('generateBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewTitle = document.getElementById('previewTitle');
        const boardEl = document.getElementById('board');
        const messageEl = document.getElementById('message');
        const storyBoxEl = document.getElementById('storyBox');
        const storyText = document.getElementById('storyText');
        const saveBtn = document.getElementById('saveBtn');
        const diffButtons = document.querySelectorAll('.diff-btn');

        diffButtons.forEach(btn => {
            btn.onclick = (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gridSize = parseInt(e.target.getAttribute('data-size'));
                initGame();
            };
        });

        // 確実なキーワード＆マルチテーマ対応アセットマッパー
        function getThemeAsset(theme) {
            let colors = ['#d35400', '#e67e22', '#c0392b'];
            let symbol = "✨";
            let secondarySymbol = "";

            // 複数キーワード・複合語の完全一致・部分一致ハンドリング
            if (theme.includes("ウサギ") && theme.includes("カメ")) {
                symbol = "🐇";
                secondarySymbol = "🐢";
                colors = ['#27ae60', '#f39c12', '#d35400'];
            } else if (theme.match(/犬|いぬ|パピー|ワンコ|ポチ/)) {
                symbol = "🐕";
                colors = ['#d35400', '#e67e22', '#f39c12'];
            } else if (theme.match(/猫|ねこ|ネコ|野良|子猫/)) {
                symbol = theme.match(/肉|食/) ? "🥩" : "🐱";
                colors = ['#c0392b', '#d35400', '#e74c3c'];
            } else if (theme.match(/鬼|魔王|悪魔|ホラー|ダーク/)) {
                symbol = "👹";
                colors = ['#2c3e50', '#8e44ad', '#c0392b'];
            } else if (theme.match(/海|水|深海|魚|青/)) {
                symbol = "🌊";
                colors = ['#2980b9', '#1abc9c', '#3498db'];
            } else if (theme.match(/空|雲|星|宇宙|月|夜/)) {
                symbol = "🌙";
                colors = ['#8e44ad', '#2c3e50', '#2980b9'];
            } else if (theme.match(/森|木|葉|自然/)) {
                symbol = "🌲";
                colors = ['#27ae60', '#16a085', '#2c3e50'];
            } else {
                // 一般的なテキストの場合も文字コードから安定した固有絵文字を割り当て
                let hash = 0;
                for (let i = 0; i < theme.length; i++) hash = theme.charCodeAt(i) + ((hash << 5) - hash);
                const palettes = [
                    ['#d35400', '#f39c12', '#c0392b'],
                    ['#2980b9', '#8e44ad', '#3498db'],
                    ['#16a085', '#27ae60', '#2c3e50'],
                    ['#c0392b', '#8e44ad', '#d35400']
                ];
                colors = palettes[Math.abs(hash) % palettes.length];
                const symbols = ["💎", "🔥", "⚡", "🗝️", "🛡️", "🔮", "🗡️", "👑", "🌟", "🌸"];
                symbol = symbols[Math.abs(hash) % symbols.length];
            }
            return { symbol, secondarySymbol, colors };
        }

        // 幾何学ステンドグラス・モザイク生成エンジン
        function drawStainedGlass(canvas, theme, isCompleted = false) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const { symbol, secondarySymbol, colors } = getThemeAsset(theme);

            if (!isCompleted) {
                ctx.fillStyle = "#0f1318";
                ctx.fillRect(0, 0, w, h);
            } else {
                const bgGrad = ctx.createLinearGradient(0, 0, w, h);
                bgGrad.addColorStop(0, colors[0]);
                bgGrad.addColorStop(0.5, colors[1]);
                bgGrad.addColorStop(1, colors[2]);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);
            }

            const cols = 6;
            const rows = 6;
            const cellW = w / cols;
            const cellH = h / rows;

            let seed = 0;
            for (let i = 0; i < theme.length; i++) seed += theme.charCodeAt(i);

            function pseudoRandom(n) {
                let x = Math.sin(seed + n) * 10000;
                return x - Math.floor(x);
            }

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let tileColorIdx = (x + y * 3 + seed) % colors.length;
                    let baseCol = colors[tileColorIdx];

                    ctx.beginPath();
                    let cx = (x + 0.5) * cellW + (pseudoRandom(x * 10 + y) - 0.5) * cellW * 0.4;
                    let cy = (y + 0.5) * cellH + (pseudoRandom(y * 10 + x + 100) - 0.5) * cellH * 0.4;
                    
                    ctx.moveTo(x * cellW, y * cellH);
                    ctx.lineTo((x + 1) * cellW, y * cellH);
                    ctx.lineTo(cx, cy);
                    ctx.closePath();

                    if (!isCompleted) {
                        ctx.fillStyle = (x + y) % 2 === 0 ? "rgba(45, 52, 54, 0.85)" : "rgba(30, 39, 46, 0.9)";
                        ctx.fill();
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = baseCol;
                        ctx.globalAlpha = 0.82;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;

                        const highlight = ctx.createRadialGradient(cx, cy, 2, cx, cy, cellW);
                        highlight.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
                        highlight.addColorStop(1, 'transparent');
                        ctx.fillStyle = highlight;
                        ctx.fill();
                    }
                }
            }

            // ステンドグラス装飾円環
            ctx.strokeStyle = isCompleted ? "rgba(255, 255, 255, 0.6)" : "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.38, w * 0.28, 0, Math.PI * 2);
            ctx.stroke();

            // メインアイコン描画（ダブルシンボル対応）
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = isCompleted ? "rgba(0, 0, 0, 0.6)" : "rgba(0, 0, 0, 0.9)";
            ctx.shadowBlur = isCompleted ? 15 : 5;

            if (secondarySymbol) {
                ctx.font = `${w * 0.28}px sans-serif`;
                ctx.fillText(symbol, w * 0.36, h * 0.38);
                ctx.fillText(secondarySymbol, w * 0.64, h * 0.38);
            } else {
                ctx.font = `${w * 0.38}px sans-serif`;
                ctx.fillText(symbol, w / 2, h * 0.38);
            }
            ctx.shadowBlur = 0;

            // タイトルプレート
            ctx.fillStyle = isCompleted ? "rgba(15, 19, 24, 0.85)" : "rgba(10, 13, 16, 0.95)";
            ctx.fillRect(w * 0.05, h * 0.72, w * 0.9, h * 0.2);
            
            ctx.strokeStyle = isCompleted ? "#f1c40f" : "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.strokeRect(w * 0.05, h * 0.72, w * 0.9, h * 0.2);

            ctx.fillStyle = isCompleted ? "#ffffff" : "#b2bec3";
            let fontSize = w * 0.075;
            if (theme.length > 8) fontSize = w * 0.062;
            if (theme.length > 12) fontSize = w * 0.052;

            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillText(theme, w / 2, h * 0.82);

            if (!isCompleted) {
                ctx.strokeStyle = "#050709";
                ctx.lineWidth = 3;
                ctx.strokeRect(2, 2, w - 4, h - 4);
            }
        }

        function getStory(theme) {
            return `📖 『${theme}の物語』\n\n教会の薔薇窓を模した幾何学的なステンドグラスの向こう側、夕暮れの淡い光に包まれた世界で、"${theme}"はそれぞれの譲れない流儀を胸にその日を生きていました。\n\n誰もが通り過ぎる日常の裏側で、手に入れた一瞬の奇跡と静かな確信は、ガラスの向こうの夜の闇の中で確かな熱を帯びていきます。\n\n幾何学的なステンドグラスのピースを一つ残らず噛み合わせ、モノクロームの枠組みに真実の光を灯したあなたへ。\nこの物語の目撃者となった今、日常の枠を超えたドラマが、あなたの現実の世界でも力強く動き出します――。`;
        }

        function updatePreview() {
            previewTitle.innerText = `テーマ: ${currentTheme}`;
            drawIllustrationPreview(previewCanvas, currentTheme);
        }

        function drawIllustrationPreview(canvas, theme) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStainedGlass(canvas, theme, true);
        }

        function generatePuzzle() {
            const val = themeInput.value.trim();
            if(!val) return;
            currentTheme = val;
            updatePreview();
            initGame();
        }

        generateBtn.onclick = generatePuzzle;

        function initGame() {
            const totalTiles = gridSize * gridSize;
            boardState = Array.from({length: totalTiles}, (_, i) => i);
            
            for (let i = 0; i < totalTiles * 6; i++) {
                const idx1 = Math.floor(Math.random() * totalTiles);
                const idx2 = Math.floor(Math.random() * totalTiles);
                [boardState[idx1], boardState[idx2]] = [boardState[idx2], boardState[idx1]];
            }

            if (isCompleted()) {
                initGame();
                return;
            }

            selectedIndex = null;
            storyBoxEl.style.display = "none";
            boardEl.classList.remove('completed');
            messageEl.innerText = "ピースをタップして選択し、入れ替えてね！";
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            const imgSize = 320;
            const completed = isCompleted();

            if (completed) {
                boardEl.classList.add('completed');
            } else {
                boardEl.classList.remove('completed');
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgSize;
            tempCanvas.height = imgSize;
            drawStainedGlass(tempCanvas, currentTheme, completed);

            for (let i = 0; i < totalTiles; i++) {
                const originalPieceId = boardState[i];
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                if (selectedIndex === i && !completed) {
                    tileDiv.classList.add('selected');
                }

                const canvas = document.createElement('canvas');
                canvas.width = imgSize / gridSize;
                canvas.height = imgSize / gridSize;
                const ctx = canvas.getContext('2d');

                const origRow = Math.floor(originalPieceId / gridSize);
                const origCol = originalPieceId % gridSize;
                
                const srcX = origCol * (imgSize / gridSize);
                const srcY = origRow * (imgSize / gridSize);
                const srcSize = imgSize / gridSize;

                ctx.drawImage(tempCanvas, srcX, srcY, srcSize, srcSize, 0, 0, canvas.width, canvas.height);

                tileDiv.appendChild(canvas);

                if (!completed) {
                    tileDiv.onclick = () => {
                        handleTileClick(i);
                    };
                }

                boardEl.appendChild(tileDiv);
            }

            checkClear();
        }

        function handleTileClick(index) {
            if (isCompleted()) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                messageEl.innerText = "選択中。もう一つのピースをタップ！";
            } else {
                const temp = boardState[selectedIndex];
                boardState[selectedIndex] = boardState[index];
                boardState[index] = temp;

                selectedIndex = null;
                messageEl.innerText = "ピースを入れ替えました！";
            }
            render();
        }

        function isCompleted() {
            return boardState.every((val, idx) => val === idx);
        }

        function checkClear() {
            if (isCompleted() && storyBoxEl.style.display !== "block") {
                messageEl.innerText = "🎉 奇跡達成！本格ステンドグラスアート＆ストーリーが解放！";
                storyText.innerText = getStory(currentTheme);
                storyBoxEl.style.display = "block";
                setTimeout(() => render(), 50);
            }
        }

        saveBtn.onclick = () => {
            alert("【True Stained Glass 保存完了】\n「" + currentTheme + "」の本格ステンドグラスアートワークと物語が、スマホのカメラロール＆Canvaワークスペースへ完璧に保存されました！");
        };

        updatePreview();
        initGame();
    </script>
</body>
</html>
