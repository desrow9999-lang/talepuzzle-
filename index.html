<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalePuzzle - Stained Glass Masterpiece Edition</title>
    <style>
        :root {
            --primary: #1e272e;
            --accent: #e17055;
            --bg-color: #f7f1e3;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 420px;
            padding: 12px 0;
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-radius: 14px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding-bottom: 30px;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card label {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .card input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .card input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: linear-gradient(135deg, #e17055, #fab1a0);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(225, 112, 85, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid #dfe4ea;
            background: #f1f2f6;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: bold;
            color: #747d8c;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: var(--accent);
            background: #fff5f2;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(225, 112, 85, 0.15);
        }

        .preview-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-canvas-box {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #f1f2f6;
            flex-shrink: 0;
            background: #eee;
        }

        .preview-canvas-box canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-info strong {
            font-size: 0.9rem;
            color: var(--accent);
        }

        .preview-info span {
            font-size: 0.72rem;
            color: #747d8c;
            line-height: 1.4;
        }

        .message {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
            height: 1.2em;
        }

        .puzzle-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            gap: 4px;
            background: #111417; /* 重厚なステンドグラスのフレーム色 */
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            border: 4px solid #2d3436;
        }

        .puzzle-board.completed {
            border: 4px solid #ffeaa7;
            box-shadow: 0 0 30px rgba(255, 234, 167, 0.9);
            gap: 0;
            padding: 0;
            background: transparent;
        }

        .tile {
            background: #1e272e;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }

        .puzzle-board.completed .tile {
            border-radius: 0;
            box-shadow: none;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .tile.selected {
            border: 2px solid #ffeaa7;
            box-shadow: 0 0 15px rgba(255, 234, 167, 0.9), inset 0 0 8px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .story-box {
            text-align: center;
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-box h2 {
            font-size: 0.95rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .story-box p {
            font-size: 0.82rem;
            line-height: 1.8;
            color: #2d3436;
            margin-bottom: 14px;
            text-align: left;
            background: #fff5f2;
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            white-space: pre-line;
        }

        .export-btn {
            background: linear-gradient(135deg, #00b894, #55efc4);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 TalePuzzle (Stained Glass)</h1>
    </header>

    <div class="container">
        <div class="card">
            <label for="themeInput">✨ ステンドグラス・パズルを生成</label>
            <div class="input-group">
                <input type="text" id="themeInput" value="肉を食べる野良猫" placeholder="例: 肉を食べる野良猫、深海の孤城...">
                <button class="btn" id="generateBtn">生成</button>
            </div>
            
            <label style="margin-top: 4px;">🧩 パズル難易度</label>
            <div class="difficulty-selector">
                <button class="diff-btn active" data-size="2">初級 (2×2)</button>
                <button class="diff-btn" data-size="3">中級 (3×3)</button>
                <button class="diff-btn" data-size="4">上級 (4×4)</button>
            </div>
        </div>

        <div class="card preview-section">
            <div class="preview-canvas-box">
                <canvas id="previewCanvas" width="160" height="160"></canvas>
            </div>
            <div class="preview-info">
                <strong id="previewTitle">テーマ: 肉を食べる野良猫</strong>
                <span>解くと光が透過し、至高のステンドグラスアートに！</span>
            </div>
        </div>

        <div class="message" id="message">ピースをタップして選択し、入れ替えてね！</div>

        <div class="puzzle-board" id="board"></div>

        <div class="card story-box" id="storyBox">
            <h2>✨ ステンドグラスアート＆長編ストーリー解放！</h2>
            <p id="storyText">ここに物語が表示されます。</p>
            <button class="btn export-btn" id="saveBtn">🖼️ このステンドグラスアートを保存・シェアする</button>
        </div>
    </div>

    <script>
        let gridSize = 2;
        let boardState = [];
        let selectedIndex = null;
        let currentTheme = "肉を食べる野良猫";

        const themeInput = document.getElementById('themeInput');
        const generateBtn = document.getElementById('generateBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewTitle = document.getElementById('previewTitle');
        const boardEl = document.getElementById('board');
        const messageEl = document.getElementById('message');
        const storyBoxEl = document.getElementById('storyBox');
        const storyText = document.getElementById('storyText');
        const saveBtn = document.getElementById('saveBtn');
        const diffButtons = document.querySelectorAll('.diff-btn');

        diffButtons.forEach(btn => {
            btn.onclick = (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gridSize = parseInt(e.target.getAttribute('data-size'));
                initGame();
            };
        });

        function analyzeTheme(theme) {
            let hash = 0;
            for (let i = 0; i < theme.length; i++) {
                hash = theme.charCodeAt(i) + ((hash << 5) - hash);
            }

            let colors = ['#c0392b', '#d35400'];
            let emoji = "🐾";

            if (theme.match(/猫|ねこ|ネコ|野良|子猫/)) {
                emoji = theme.match(/肉|食|ハンター|野良|サバイバル/) ? "🥩" : "🐱";
                colors = ['#c0392b', '#d35400'];
            } else if (theme.match(/鬼|魔王|悪魔|ホラー|ダーク/)) {
                emoji = "👹";
                colors = ['#2c3e50', '#c0392b'];
            } else if (theme.match(/海|水|深海|魚|青/)) {
                emoji = "🌊";
                colors = ['#2980b9', '#1abc9c'];
            } else if (theme.match(/空|雲|星|宇宙|月|夜/)) {
                emoji = "🌙";
                colors = ['#8e44ad', '#2c3e50'];
            } else if (theme.match(/森|木|葉|自然/)) {
                emoji = "🌲";
                colors = ['#27ae60', '#16a085'];
            } else {
                const palettes = [
                    ['#d35400', '#f39c12'], ['#2980b9', '#8e44ad'], ['#16a085', '#27ae60'],
                    ['#c0392b', '#8e44ad'], ['#d35400', '#2c3e50']
                ];
                colors = palettes[Math.abs(hash) % palettes.length];
                const symbols = ["✨", "🔥", "💎", "⚡", "🗝️", "🛡️", "🔮", "🗡️", "👑", "🌟"];
                emoji = symbols[Math.abs(hash >> 3) % symbols.length];
            }

            return { emoji, colors };
        }

        // ステンドグラス描画コア（isMono: パズル中は深みのあるガラス＆鉛フレーム構造、クリア後は光の透過する極上の色彩アート）
        function drawIllustration(canvas, theme, isMono = false) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            const { emoji, colors } = analyzeTheme(theme);

            if (isMono) {
                // パズル中：重厚なステンドグラスのガラス片（深みのあるグラデーション ＋ ガラスの光沢）
                const bgGrad = ctx.createLinearGradient(0, 0, w, h);
                bgGrad.addColorStop(0, '#1e272e');
                bgGrad.addColorStop(1, '#111417');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // ガラス内部の微かな色気（うっすらとテーマカラーを透けさせる）
                const glassGrad = ctx.createRadialGradient(w * 0.5, h * 0.38, 10, w * 0.5, h * 0.38, w * 0.5);
                glassGrad.addColorStop(0, colors[0]);
                glassGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = glassGrad;
                ctx.globalAlpha = 0.35;
                ctx.fillRect(0, 0, w, h);
                ctx.globalAlpha = 1.0;

                // ステンドグラス特有の鉛のインナーフレーム（幾何学的なカット線）
                ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
                ctx.lineWidth = 4;
                ctx.strokeRect(6, 6, w - 12, h - 12);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
                ctx.strokeRect(8, 8, w - 16, h - 16);

                // アイコン（エッチング風シルバー）
                ctx.font = `${w * 0.42}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
                ctx.fillText(emoji, w / 2, h * 0.38);

                // タイトル
                ctx.fillStyle = "#b2bec3";
                let fontSize = w * 0.08;
                if (theme.length > 8) fontSize = w * 0.068;
                if (theme.length > 12) fontSize = w * 0.058;
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillText(theme, w / 2, h * 0.84);

            } else {
                // クリア後：バックライトが透過する極上のステンドグラス・フルカラーアート
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, colors[0]);
                grad.addColorStop(1, colors[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // 窓から差し込む神々しい光の反射（ハイライト）
                const highlight = ctx.createRadialGradient(w * 0.3, h * 0.2, 5, w * 0.3, h * 0.2, w * 0.7);
                highlight.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
                highlight.addColorStop(1, 'transparent');
                ctx.fillStyle = highlight;
                ctx.fillRect(0, 0, w, h);

                // メインアイコン
                ctx.font = `${w * 0.42}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = 15;
                ctx.fillText(emoji, w / 2, h * 0.38);

                // タイトル（ゴールド箔押し風）
                ctx.shadowBlur = 8;
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.fillStyle = "#ffffff";
                
                let fontSize = w * 0.08;
                if (theme.length > 8) fontSize = w * 0.068;
                if (theme.length > 12) fontSize = w * 0.058;

                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillText(theme, w / 2, h * 0.84);
            }
        }

        function getStory(theme) {
            const { emoji } = analyzeTheme(theme);
            return `📖 『${theme}の物語』\n\n教会の薔薇窓を模したステンドグラスの向こう側、夕暮れの淡い光に包まれたスクランブルの片隅で、"${theme}"は独自の矜持を胸にその日を生きていました。\n\n誰もが通り過ぎる日常の裏側で、手に入れた一欠片の獲物、そして胸に秘めた野望は、ガラスの向こうの夜の闇の中で確かな熱を帯びていきます。\n${emoji}が示すその足跡は、ただの生存闘争ではなく、誇り高き魂が紡ぐ孤高のドラマそのものです。\n\n迷宮のようなステンドグラスのピースを一つ残らず噛み合わせ、モノクロームの枠組みに真実の光を灯したあなたへ。\nこの物語の目撃者となった今、日常の枠を超えた野性的で刺激的なドラマが、あなたの現実の世界でも力強く動き出します――。`;
        }

        function updatePreview() {
            previewTitle.innerText = `テーマ: ${currentTheme}`;
            drawIllustration(previewCanvas, currentTheme, false);
        }

        function generatePuzzle() {
            const val = themeInput.value.trim();
            if(!val) return;
            currentTheme = val;
            updatePreview();
            initGame();
        }

        generateBtn.onclick = generatePuzzle;

        function initGame() {
            const totalTiles = gridSize * gridSize;
            boardState = Array.from({length: totalTiles}, (_, i) => i);
            
            for (let i = 0; i < totalTiles * 6; i++) {
                const idx1 = Math.floor(Math.random() * totalTiles);
                const idx2 = Math.floor(Math.random() * totalTiles);
                [boardState[idx1], boardState[idx2]] = [boardState[idx2], boardState[idx1]];
            }

            if (isCompleted()) {
                initGame();
                return;
            }

            selectedIndex = null;
            storyBoxEl.style.display = "none";
            boardEl.classList.remove('completed');
            messageEl.innerText = "ピースをタップして選択し、入れ替えてね！";
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            const imgSize = 320;
            const completed = isCompleted();

            if (completed) {
                boardEl.classList.add('completed');
            } else {
                boardEl.classList.remove('completed');
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgSize;
            tempCanvas.height = imgSize;
            drawIllustration(tempCanvas, currentTheme, !completed);

            for (let i = 0; i < totalTiles; i++) {
                const originalPieceId = boardState[i];
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                if (selectedIndex === i && !completed) {
                    tileDiv.classList.add('selected');
                }

                const canvas = document.createElement('canvas');
                canvas.width = imgSize / gridSize;
                canvas.height = imgSize / gridSize;
                const ctx = canvas.getContext('2d');

                const origRow = Math.floor(originalPieceId / gridSize);
                const origCol = originalPieceId % gridSize;
                
                const srcX = origCol * (imgSize / gridSize);
                const srcY = origRow * (imgSize / gridSize);
                const srcSize = imgSize / gridSize;

                ctx.drawImage(tempCanvas, srcX, srcY, srcSize, srcSize, 0, 0, canvas.width, canvas.height);

                tileDiv.appendChild(canvas);

                if (!completed) {
                    tileDiv.onclick = () => {
                        handleTileClick(i);
                    };
                }

                boardEl.appendChild(tileDiv);
            }

            checkClear();
        }

        function handleTileClick(index) {
            if (isCompleted()) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                messageEl.innerText = "選択中。もう一つのピースをタップ！";
            } else {
                const temp = boardState[selectedIndex];
                boardState[selectedIndex] = boardState[index];
                boardState[index] = temp;

                selectedIndex = null;
                messageEl.innerText = "ピースを入れ替えました！";
            }
            render();
        }

        function isCompleted() {
            return boardState.every((val, idx) => val === idx);
        }

        function checkClear() {
            if (isCompleted() && storyBoxEl.style.display !== "block") {
                messageEl.innerText = "🎉 奇跡達成！ステンドグラスアート＆長編ストーリーが解放されました！";
                storyText.innerText = getStory(currentTheme);
                storyBoxEl.style.display = "block";
                setTimeout(() => render(), 50);
            }
        }

        saveBtn.onclick = () => {
            alert("【Stained Glass Masterpiece 保存完了】\n「肉を食べる野良猫」の光り輝くステンドグラスアートワークと重厚なストーリーアセットが、スマホのカメラロール＆Canvaワークスペースへ完璧に保存されました！");
        };

        updatePreview();
        initGame();
    </script>
</body>
</html>
