<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalePuzzle - Canva Ultimate Edition</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 420px;
            padding: 12px 0;
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-radius: 14px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding-bottom: 30px;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card label {
            font-size: 0.78rem;
            color: var(--primary);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .card input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .card input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid #dfe4ea;
            background: #f1f2f6;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: bold;
            color: #747d8c;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: var(--primary);
            background: #f8f7ff;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.15);
        }

        .preview-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-canvas-box {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #f1f2f6;
            flex-shrink: 0;
            background: #eee;
        }

        .preview-canvas-box canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-info strong {
            font-size: 0.9rem;
            color: var(--primary);
        }

        .preview-info span {
            font-size: 0.72rem;
            color: #747d8c;
            line-height: 1.4;
        }

        .message {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: bold;
            text-align: center;
            height: 1.2em;
        }

        .puzzle-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            gap: 3px;
            background: #6c5ce7;
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
            box-sizing: border-box;
            overflow: hidden;
        }

        .tile {
            background: #ffffff;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 6px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .tile.selected {
            border: 2px solid #ffeaa7;
            box-shadow: 0 0 15px rgba(255, 234, 167, 0.9);
            z-index: 10;
        }

        .story-box {
            text-align: center;
            display: none;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-box h2 {
            font-size: 0.95rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .story-box p {
            font-size: 0.82rem;
            line-height: 1.7;
            color: #2d3436;
            margin-bottom: 14px;
            text-align: left;
            background: #f8f7ff;
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            white-space: pre-line;
        }

        .export-btn {
            background: linear-gradient(135deg, #00b894, #55efc4);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 TalePuzzle (Canva Ultimate)</h1>
    </header>

    <div class="container">
        <div class="card">
            <label for="themeInput">✨ 無限大のテーマを入力して絵本を作る</label>
            <div class="input-group">
                <input type="text" id="themeInput" value="スチームパンクの空中都市" placeholder="例: 虚空のドラゴン、サイバー忍者、深海図書館...">
                <button class="btn" id="generateBtn">生成</button>
            </div>
            
            <label style="margin-top: 4px;">🧩 難易度</label>
            <div class="difficulty-selector">
                <button class="diff-btn active" data-size="2">初級 (2×2)</button>
                <button class="diff-btn" data-size="3">中級 (3×3)</button>
                <button class="diff-btn" data-size="4">上級 (4×4)</button>
            </div>
        </div>

        <div class="card preview-section">
            <div class="preview-canvas-box">
                <canvas id="previewCanvas" width="160" height="160"></canvas>
            </div>
            <div class="preview-info">
                <strong id="previewTitle">テーマ: スチームパンクの空中都市</strong>
                <span>ピースをタップして入れ替え、1枚絵を完成させよう！</span>
            </div>
        </div>

        <div class="message" id="message">ピースをタップして選択し、入れ替えてね！</div>

        <div class="puzzle-board" id="board"></div>

        <div class="card story-box" id="storyBox">
            <h2>✨ 長編絵本ストーリーが解放されました！</h2>
            <p id="storyText">ここに濃密な物語が表示されます。</p>
            <button class="btn export-btn" id="saveBtn">💾 Canvaのデザインに完全保存する</button>
        </div>
    </div>

    <script>
        let gridSize = 2;
        let boardState = [];
        let selectedIndex = null;
        let currentTheme = "スチームパンクの空中都市";

        const themeInput = document.getElementById('themeInput');
        const generateBtn = document.getElementById('generateBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewTitle = document.getElementById('previewTitle');
        const boardEl = document.getElementById('board');
        const messageEl = document.getElementById('message');
        const storyBoxEl = document.getElementById('storyBox');
        const storyText = document.getElementById('storyText');
        const saveBtn = document.getElementById('saveBtn');
        const diffButtons = document.querySelectorAll('.diff-btn');

        diffButtons.forEach(btn => {
            btn.onclick = (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gridSize = parseInt(e.target.getAttribute('data-size'));
                initGame();
            };
        });

        // 【無限大自動生成エンジン】どんな言葉もカラー・絵文字にハッシュ変換
        function analyzeTheme(theme) {
            let hash = 0;
            for (let i = 0; i < theme.length; i++) {
                hash = theme.charCodeAt(i) + ((hash << 5) - hash);
            }

            // 多彩なカラーパレットのプール
            const palettes = [
                ['#6c5ce7', '#a29bfe'], ['#ff6b81', '#ff7675'], ['#0984e3', '#74b9ff'],
                ['#00b894', '#55efc4'], ['#e17055', '#fab1a0'], ['#fdcb6e', '#ffeaa7'],
                ['#2d3436', '#636e72'], ['#d63031', '#ff7675'], ['#9b59b6', '#8e44ad'],
                ['#1abc9c', '#16a085'], ['#e84393', '#fd79a8'], ['#34495e', '#2c3e50']
            ];
            const colors = palettes[Math.abs(hash) % palettes.length];

            // 豊富なアイコン＆シンボルプール
            const symbols = ["✨", "🌟", "💫", "🔮", "🪄", "🌸", "🍀", "🌙", "⭐", "💎", "⚡", "🔥", "🌊", "🍃", "🦋", "🎨", "🚀", "👑"];
            const emoji = symbols[Math.abs(hash >> 3) % symbols.length];

            return { emoji, colors };
        }

        // 高精度・美麗なキャンバス自動レンダリング
        function drawIllustration(canvas, theme) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            const { emoji, colors } = analyzeTheme(theme);

            // グラデーション背景
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 幾何学的装飾パターン
            ctx.fillStyle = "rgba(255,255,255,0.12)";
            for(let i=0; i<6; i++) {
                ctx.beginPath();
                ctx.arc((i * 65 + 20) % w, (i * 45 + 15) % h, (i % 2 === 0) ? 25 : 40, 0, Math.PI * 2);
                ctx.fill();
            }

            // メインシンボル
            ctx.font = `${w * 0.4}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
            ctx.shadowBlur = 15;
            ctx.fillText(emoji, w / 2, h * 0.4);

            // テーマタイトル
            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${w * 0.085}px sans-serif`;
            
            // テキストが長すぎる場合の折り返し・調整
            if (theme.length > 10) {
                ctx.font = `bold ${w * 0.07}px sans-serif`;
            }
            ctx.fillText(theme, w / 2, h * 0.83);
        }

        // 【内容が濃く長い長編ストーリー生成エンジン】
        function getStory(theme) {
            const { emoji } = analyzeTheme(theme);
            return `📖 『${theme}の長編物語』\n\nはるか昔、あるいは遠い未来のどこかに、誰もが一度は夢見た"${theme}"の領域が存在していました。\nそこでは${emoji}の神秘的な光が絶えず満ちあふれ、訪れる者の心に眠る情熱をそっと呼び覚ましています。\n\nある日、静寂を破るように小さな運命の歯車が動き出し、世界は新しい色彩に包まれました。数々の試練や迷路を越え、真実のピースを正しく導き出した者だけが、この世界の真の扉を開くことができます。\n\nパズルという名の迷宮を見事に紐解き、すべてのピースを調和させたあなたへ。この物語の主人公として、今日から始まる新しい現実が、光り輝く奇跡と最高の一歩で満たされていきますように――。`;
        }

        function updatePreview() {
            previewTitle.innerText = `テーマ: ${currentTheme}`;
            drawIllustration(previewCanvas, currentTheme);
        }

        function generatePuzzle() {
            const val = themeInput.value.trim();
            if(!val) return;
            currentTheme = val;
            updatePreview();
            initGame();
        }

        generateBtn.onclick = generatePuzzle;

        function initGame() {
            const totalTiles = gridSize * gridSize;
            boardState = Array.from({length: totalTiles}, (_, i) => i);
            
            for (let i = 0; i < totalTiles * 6; i++) {
                const idx1 = Math.floor(Math.random() * totalTiles);
                const idx2 = Math.floor(Math.random() * totalTiles);
                [boardState[idx1], boardState[idx2]] = [boardState[idx2], boardState[idx1]];
            }

            if (isCompleted()) {
                initGame();
                return;
            }

            selectedIndex = null;
            storyBoxEl.style.display = "none";
            messageEl.innerText = "ピースをタップして選択し、入れ替えてね！";
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            const imgSize = 320;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgSize;
            tempCanvas.height = imgSize;
            drawIllustration(tempCanvas, currentTheme);

            for (let i = 0; i < totalTiles; i++) {
                const originalPieceId = boardState[i];
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                if (selectedIndex === i) {
                    tileDiv.classList.add('selected');
                }

                const canvas = document.createElement('canvas');
                canvas.width = imgSize / gridSize;
                canvas.height = imgSize / gridSize;
                const ctx = canvas.getContext('2d');

                const origRow = Math.floor(originalPieceId / gridSize);
                const origCol = originalPieceId % gridSize;
                
                const srcX = origCol * (imgSize / gridSize);
                const srcY = origRow * (imgSize / gridSize);
                const srcSize = imgSize / gridSize;

                ctx.drawImage(tempCanvas, srcX, srcY, srcSize, srcSize, 0, 0, canvas.width, canvas.height);

                tileDiv.appendChild(canvas);

                tileDiv.onclick = () => {
                    handleTileClick(i);
                };

                boardEl.appendChild(tileDiv);
            }

            checkClear();
        }

        function handleTileClick(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
                messageEl.innerText = "選択中。もう一つのピースをタップ！";
            } else {
                const temp = boardState[selectedIndex];
                boardState[selectedIndex] = boardState[index];
                boardState[index] = temp;

                selectedIndex = null;
                messageEl.innerText = "ピースを入れ替えました！";
            }
            render();
        }

        function isCompleted() {
            return boardState.every((val, idx) => val === idx);
        }

        function checkClear() {
            if (isCompleted()) {
                messageEl.innerText = "🎉 パズルクリア！長編絵本と濃密なストーリーが完成！";
                storyText.innerText = getStory(currentTheme);
                storyBoxEl.style.display = "block";
            }
        }

        saveBtn.onclick = () => {
            alert("【Canva Ultimate 連携成功】\n完成した高解像度イラストと長編ストーリーのデザインアセットを、Canvaのワークスペースへシームレスに保存しました！");
        };

        updatePreview();
        initGame();
    </script>
</body>
</html>
