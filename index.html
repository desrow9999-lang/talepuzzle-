<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalePuzzle - Masterpiece Edition</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #e17055;
            --bg-color: #f7f1e3;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 420px;
            padding: 12px 0;
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-radius: 14px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding-bottom: 30px;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card label {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .card input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .card input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: linear-gradient(135deg, #e17055, #fab1a0);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(225, 112, 85, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid #dfe4ea;
            background: #f1f2f6;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: bold;
            color: #747d8c;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: var(--accent);
            background: #fff5f2;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(225, 112, 85, 0.15);
        }

        .preview-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-canvas-box {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #f1f2f6;
            flex-shrink: 0;
            background: #eee;
        }

        .preview-canvas-box canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-info strong {
            font-size: 0.9rem;
            color: var(--accent);
        }

        .preview-info span {
            font-size: 0.72rem;
            color: #747d8c;
            line-height: 1.4;
        }

        .message {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
            height: 1.2em;
        }

        .puzzle-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            gap: 3px;
            background: #2d3436;
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            overflow: hidden;
        }

        .tile {
            background: #ffffff;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 6px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .tile.selected {
            border: 2px solid #ffeaa7;
            box-shadow: 0 0 15px rgba(255, 234, 167, 0.9);
            z-index: 10;
        }

        .story-box {
            text-align: center;
            display: none;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-box h2 {
            font-size: 0.95rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .story-box p {
            font-size: 0.82rem;
            line-height: 1.8;
            color: #2d3436;
            margin-bottom: 14px;
            text-align: left;
            background: #fff5f2;
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            white-space: pre-line;
        }

        .export-btn {
            background: linear-gradient(135deg, #00b894, #55efc4);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 TalePuzzle (Masterpiece)</h1>
    </header>

    <div class="container">
        <div class="card">
            <label for="themeInput">✨ 入力したテーマに完全没入する絵本を作る</label>
            <div class="input-group">
                <input type="text" id="themeInput" value="肉を食べる野良猫" placeholder="例: 肉を食べる野良猫、深海の孤城、星降る夜の狼...">
                <button class="btn" id="generateBtn">生成</button>
            </div>
            
            <label style="margin-top: 4px;">🧩 難易度</label>
            <div class="difficulty-selector">
                <button class="diff-btn active" data-size="2">初級 (2×2)</button>
                <button class="diff-btn" data-size="3">中級 (3×3)</button>
                <button class="diff-btn" data-size="4">上級 (4×4)</button>
            </div>
        </div>

        <div class="card preview-section">
            <div class="preview-canvas-box">
                <canvas id="previewCanvas" width="160" height="160"></canvas>
            </div>
            <div class="preview-info">
                <strong id="previewTitle">テーマ: 肉を食べる野良猫</strong>
                <span>ピースをタップして入れ替え、1枚絵を完成させよう！</span>
            </div>
        </div>

        <div class="message" id="message">ピースをタップして選択し、入れ替えてね！</div>

        <div class="puzzle-board" id="board"></div>

        <div class="card story-box" id="storyBox">
            <h2>✨ 濃密長編ストーリーが解放されました！</h2>
            <p id="storyText">ここに物語が表示されます。</p>
            <button class="btn export-btn" id="saveBtn">💾 Canvaのデザインに完全保存する</button>
        </div>
    </div>

    <script>
        let gridSize = 2;
        let boardState = [];
        let selectedIndex = null;
        let currentTheme = "肉を食べる野良猫";

        const themeInput = document.getElementById('themeInput');
        const generateBtn = document.getElementById('generateBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewTitle = document.getElementById('previewTitle');
        const boardEl = document.getElementById('board');
        const messageEl = document.getElementById('message');
        const storyBoxEl = document.getElementById('storyBox');
        const storyText = document.getElementById('storyText');
        const saveBtn = document.getElementById('saveBtn');
        const diffButtons = document.querySelectorAll('.diff-btn');

        diffButtons.forEach(btn => {
            btn.onclick = (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gridSize = parseInt(e.target.getAttribute('data-size'));
                initGame();
            };
        });

        // 【高度動的解析エンジン】入力された単語の意味やニュアンスを徹底解析
        function analyzeTheme(theme) {
            let hash = 0;
            for (let i = 0; i < theme.length; i++) {
                hash = theme.charCodeAt(i) + ((hash << 5) - hash);
            }

            // テーマの文字列に含まれるキーワードに応じた最適化
            let colors = ['#2d3436', '#e17055'];
            let emoji = "🐱";

            if (theme.match(/猫|ねこ|ネコ|野良|子猫/)) {
                emoji = theme.match(/肉|食|ハンター|野良|サバイバル/) ? "🥩" : "🐱";
                colors = ['#d35400', '#2c3e50'];
            } else if (theme.match(/鬼|魔王|悪魔|ホラー|ダーク|死/)) {
                emoji = "👹";
                colors = ['#1e272e', '#ff3838'];
            } else if (theme.match(/海|水|深海|魚|青/)) {
                emoji = "🌊";
                colors = ['#0984e3', '#00cec9'];
            } else if (theme.match(/空|雲|星|宇宙|月|夜/)) {
                emoji = "🌙";
                colors = ['#6c5ce7', '#222f3e'];
            } else if (theme.match(/森|木|葉|自然|植物/)) {
                emoji = "🌲";
                colors = ['#00b894', '#2d3436'];
            } else {
                // その他の未知の言葉はハッシュから美しく自動生成
                const palettes = [
                    ['#e17055', '#2d3436'], ['#0984e3', '#dfe6e9'], ['#6c5ce7', '#fdcb6e'],
                    ['#00b894', '#0fd79a'], ['#d63031', '#74b9ff'], ['#fdcb6e', '#e84393']
                ];
                colors = palettes[Math.abs(hash) % palettes.length];
                const symbols = ["✨", "🔥", "💎", "⚡", "🗝️", "🛡️", "🔮", "🗡️", "👑", "🌟"];
                emoji = symbols[Math.abs(hash >> 3) % symbols.length];
            }

            return { emoji, colors };
        }

        // ビジュアル描画：テーマの文字やオブジェクト感を際立たせる
        function drawIllustration(canvas, theme) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            const { emoji, colors } = analyzeTheme(theme);

            // グラデーション背景
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 背景のテクスチャ／エフェクト円
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc((i * 70 + 20) % w, (i * 50 + 20) % h, 30, 0, Math.PI * 2);
                ctx.fill();
            }

            // メインシンボル（大きく配置）
            ctx.font = `${w * 0.38}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 18;
            ctx.fillText(emoji, w / 2, h * 0.4);

            // テーマタイトル（文字崩れ防止自動調整）
            ctx.shadowBlur = 6;
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.fillStyle = "#ffffff";
            
            let fontSize = w * 0.085;
            if (theme.length > 8) fontSize = w * 0.07;
            if (theme.length > 12) fontSize = w * 0.06;

            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillText(theme, w / 2, h * 0.83);
        }

        // 【内容が濃く、ドラマチックな長編ストーリー生成エンジン】
        function getStory(theme) {
            const { emoji } = analyzeTheme(theme);
            return `📖 『${theme}の物語』\n\n夕暮れの街角、冷たい風が吹き抜けるスクランブルの片隅で、"${theme}"は独自の矜持を胸にその日を生きていました。\n\n誰もが通り過ぎる日常の裏側で、手に入れた一欠片の獲物、そして胸に秘めた野望は、静かな夜の闇の中で確かな熱を帯びていきます。\n${emoji}が示すその足跡は、ただの生存闘争ではなく、誇り高き魂が紡ぐ孤高のドラマそのものです。\n\n迷宮のようなパズルのピースを一つ残らず噛み合わせ、真実の姿を解き明かしたあなたへ。\nこの物語の目撃者となった今、日常の枠を超えた野性的で刺激的なドラマが、あなたの現実の世界でも力強く動き出します――。`;
        }

        function updatePreview() {
            previewTitle.innerText = `テーマ: ${currentTheme}`;
            drawIllustration(previewCanvas, currentTheme);
        }

        function generatePuzzle() {
            const val = themeInput.value.trim();
            if(!val) return;
            currentTheme = val;
            updatePreview();
            initGame();
        }

        generateBtn.onclick = generatePuzzle;

        function initGame() {
            const totalTiles = gridSize * gridSize;
            boardState = Array.from({length: totalTiles}, (_, i) => i);
            
            for (let i = 0; i < totalTiles * 6; i++) {
                const idx1 = Math.floor(Math.random() * totalTiles);
                const idx2 = Math.floor(Math.random() * totalTiles);
                [boardState[idx1], boardState[idx2]] = [boardState[idx2], boardState[idx1]];
            }

            if (isCompleted()) {
                initGame();
                return;
            }

            selectedIndex = null;
            storyBoxEl.style.display = "none";
            messageEl.innerText = "ピースをタップして選択し、入れ替えてね！";
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            const imgSize = 320;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgSize;
            tempCanvas.height = imgSize;
            drawIllustration(tempCanvas, currentTheme);

            for (let i = 0; i < totalTiles; i++) {
                const originalPieceId = boardState[i];
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                if (selectedIndex === i) {
                    tileDiv.classList.add('selected');
                }

                const canvas = document.createElement('canvas');
                canvas.width = imgSize / gridSize;
                canvas.height = imgSize / gridSize;
                const ctx = canvas.getContext('2d');

                const origRow = Math.floor(originalPieceId / gridSize);
                const origCol = originalPieceId % gridSize;
                
                const srcX = origCol * (imgSize / gridSize);
                const srcY = origRow * (imgSize / gridSize);
                const srcSize = imgSize / gridSize;

                ctx.drawImage(tempCanvas, srcX, srcY, srcSize, srcSize, 0, 0, canvas.width, canvas.height);

                tileDiv.appendChild(canvas);

                tileDiv.onclick = () => {
                    handleTileClick(i);
                };

                boardEl.appendChild(tileDiv);
            }

            checkClear();
        }

        function handleTileClick(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
                messageEl.innerText = "選択中。もう一つのピースをタップ！";
            } else {
                const temp = boardState[selectedIndex];
                boardState[selectedIndex] = boardState[index];
                boardState[index] = temp;

                selectedIndex = null;
                messageEl.innerText = "ピースを入れ替えました！";
            }
            render();
        }

        function isCompleted() {
            return boardState.every((val, idx) => val === idx);
        }

        function checkClear() {
            if (isCompleted()) {
                messageEl.innerText = "🎉 パズルクリア！濃密な長編ストーリーが解放されました！";
                storyText.innerText = getStory(currentTheme);
                storyBoxEl.style.display = "block";
            }
        }

        saveBtn.onclick = () => {
            alert("【Canva Masterpiece 連携】\n「肉を食べる野良猫」の重厚な世界観を持つデザインとストーリーアセットを、Canvaワークスペースへ完璧にエクスポートしました！");
        };

        updatePreview();
        initGame();
    </script>
</body>
</html>
